
name: Build and Deploy PC Club BD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build

      
      - name: Verify static export
        run: |
          echo "Checking exported website..."
          test -f out/index.html || {
            echo "ERROR: out/index.html is missing"
            find out -maxdepth 3 -type f | head -50
            exit 1
          }

          find out/_next/static/css -maxdepth 1 -name '*.css' -type f | grep -q . || {
            echo "ERROR: No CSS files found in export"
            find out -maxdepth 4 -type f | head -100
            exit 1
          }

          echo "Static export and CSS checks passed."



      - name: Deploy to cPanel using FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: out/
          server-dir: /
          dangerous-clean-slate: false

